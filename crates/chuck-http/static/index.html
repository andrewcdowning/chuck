<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuck</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem("chuck-theme") || "ink";
</script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Chuck</h1>
    <div class="label" style="margin-bottom:8px">Filter</div>
    <div id="tags"></div>
    <details class="rules" id="rules">
      <summary>Auto-tag rules</summary>
      <div class="hint" style="margin:8px 0">If a note contains any keyword, it gets the tag. Separate keywords with commas.</div>
      <div id="rulelist"></div>
      <input id="rule-kw" placeholder="Keywords, e.g. jira, PR-">
      <input id="rule-tag" placeholder="Tag, e.g. work">
      <div class="row"><button class="btn sm primary" id="rule-add" type="button">Add rule</button><button class="btn sm" id="rule-apply" type="button">Apply to existing notes</button></div>
      <div class="hint" id="rule-msg"></div>
    </details>
    <details class="acct" id="acct">
      <summary>Account</summary>
      <div class="hint" id="acct-who" style="margin:8px 0"></div>
      <div class="row"><a class="btn sm" id="acct-export" href="/api/me/export" download>Export my data (.zip)</a></div>
      <div class="hint" style="margin-top:12px">Deleting your account erases all your notes, files and rules. Type your id to confirm.</div>
      <input id="acct-confirm" placeholder="Your account id" autocomplete="off">
      <div class="row"><button class="btn sm" id="acct-delete" type="button">Delete my account</button></div>
      <div class="hint" id="acct-msg"></div>
      <div id="admin" hidden>
        <div class="label" style="margin:16px 0 4px">Accounts (counts only, never content)</div>
        <div id="userlist"></div>
      </div>
    </details>
  </aside>
  <main>
    <div class="bar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="seg" id="views" role="group" aria-label="View"><button data-v="feed">Feed</button><button data-v="board">Board</button></div>
        <div class="seg" id="layouts" role="group" aria-label="Board layout"><button data-l="cols" title="Pack cards into columns with no gaps">Columns</button><button data-l="rows" title="Line cards up in rows of equal height">Rows</button></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn sm" id="notify" hidden>Enable alerts</button>
        <a class="btn sm" id="export" href="/api/export" download style="text-decoration:none">Export .md</a>
        <div class="seg" id="themes" role="group" aria-label="Theme"><button data-t="dark">Dark</button><button data-t="ink">Ink</button><button data-t="light">Light</button></div>
      </div>
    </div>

    <div class="seg" id="modes" role="group" aria-label="Capture type" style="margin-bottom:8px">
      <button data-m="note">Note</button><button data-m="todo">Todo</button><button data-m="reminder">Reminder</button>
    </div>
    <div id="composer"></div>

    <div class="row">
      <input id="q" placeholder="Search">
      <input id="from" type="date" title="From"><input id="to" type="date" title="To">
    </div>
    <div id="out"></div>
    <div class="row"><button class="btn" id="more" hidden>Load more</button></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="sr" id="live" aria-live="polite"></div>
<script src="/assets/helpers.js"></script>
<script src="/assets/media.js"></script>
<script src="/assets/audio.js"></script>
<script src="/assets/composer.js"></script>
<script src="/assets/cards.js"></script>
<script src="/assets/suggestions.js"></script>
<script src="/assets/settings.js"></script>
<script src="/assets/moving.js"></script>
<script src="/assets/feed.js"></script>
<script src="/assets/reminders.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
