/* ---------- media ----------
   Photos are redrawn on a canvas before upload: that applies the camera's rotation, caps the size, makes a small
   preview, and drops all metadata (GPS location included). The server strips metadata again and checks every file.
   GIFs are kept as they are so animation survives. */
const MEDIA_ACCEPT = "image/jpeg,image/png,image/gif,image/webp,image/avif,image/heic,image/heif,.heic,.heif," +
  "audio/webm,audio/ogg,audio/mp4,audio/x-m4a,audio/mpeg,audio/wav,audio/x-wav,.m4a,.mp3,.ogg,.oga,.opus,.wav,.weba";
const MAX_SIDE = 2560, THUMB_SIDE = 640;
let pendingMedia = [];   // images attached in the composer, waiting for Save: { name, status, prepared, url, error }
let picker;              // the hidden file input behind "Attach" and #photo
let composerRecorder = null;   // the composer's recorder panel; kept across type switches so a recording survives

const isHeic = f => /image\/hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name);
const looksLikeImage = f => /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|avif|hei[cf])$/i.test(f.name);
const looksLikeAudio = f => /^audio\//.test(f.type) || /\.(m4a|mp3|ogg|oga|opus|wav|weba)$/i.test(f.name);
const looksLikeMedia = f => looksLikeImage(f) || looksLikeAudio(f);
const fmtDur = ms => { const t = Math.max(0, Math.round((ms || 0) / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const hasFiles = e => !!e.dataTransfer && [...e.dataTransfer.types].includes("Files");
// Encoding never waits forever: some browsers stall instead of failing on a format they cannot write.
const canvasBlob = (c, type, q) => Promise.race([
  new Promise(res => c.toBlob(res, type, q)),
  new Promise(res => setTimeout(() => res(null), 15000)),
]);
// Synchronous check: an unsupported type makes toDataURL return PNG instead.
const canEncode = (() => {
  const seen = {};
  return type => seen[type] ??= (() => { const c = document.createElement("canvas"); c.width = c.height = 1; return c.toDataURL(type).startsWith("data:" + type); })();
})();

async function decodeImage(file) {
  try { return await createImageBitmap(file); } catch {}
  const url = URL.createObjectURL(file);   // fallback through <img>, which some browsers decode more formats with
  try { const img = new Image(); img.src = url; await img.decode(); return await createImageBitmap(img); }
  finally { URL.revokeObjectURL(url); }
}

async function encodeImage(bitmap, maxSide, type) {
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale)), h = Math.max(1, Math.round(bitmap.height * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  let blob = canEncode(type) ? await canvasBlob(c, type, 0.88) : null;
  if (!blob || blob.type !== type) blob = await canvasBlob(c, "image/png");   // this browser cannot encode `type`
  if (!blob) throw new Error("this browser could not encode the image");
  return { blob, w, h };
}

async function prepareImage(file) {
  if (!looksLikeImage(file)) throw new Error(`${file.name}: not a picture or audio file. Chuck accepts JPEG, PNG, GIF, WebP, AVIF, HEIC, and WebM, Ogg, M4A, MP3 and WAV audio.`);
  if (file.size > 60 * 1024 * 1024) throw new Error(`${file.name}: larger than 60 MB.`);
  let bitmap;
  try { bitmap = await decodeImage(file); }
  catch { throw new Error(isHeic(file) ? `${file.name}: this browser can't read HEIC photos. Save it as JPEG and try again.` : `${file.name}: couldn't read this image.`); }
  const gif = file.type === "image/gif" || /\.gif$/i.test(file.name);
  const photo = /jpe?g|hei[cf]/i.test(file.type) || /\.(jpe?g|hei[cf])$/i.test(file.name);
  const type = photo ? "image/jpeg" : "image/webp";
  const full = gif ? { blob: file, w: bitmap.width, h: bitmap.height } : await encodeImage(bitmap, MAX_SIDE, type);
  const thumb = gif ? null : await encodeImage(bitmap, THUMB_SIDE, type);
  bitmap.close?.();
  if (full.blob.size > 20 * 1024 * 1024) throw new Error(`${file.name}: still larger than 20 MB after resizing.`);
  const ext = { "image/jpeg": "jpg", "image/webp": "webp", "image/png": "png", "image/gif": "gif" }[full.blob.type] || "img";
  const name = gif ? file.name : file.name.replace(/\.[^.]+$/, "") + "." + ext;
  return { full: full.blob, thumb: thumb && thumb.blob, width: full.w, height: full.h, name };
}

function sendBlob(method, url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status < 300) return resolve(x.responseText ? JSON.parse(x.responseText) : null);
      let m = x.statusText || "upload failed";
      try { m = JSON.parse(x.responseText).error || m; } catch {}
      reject(new Error(m));
    };
    x.onerror = () => reject(new Error("network error"));
    x.send(blob);
  });
}

// Audio is uploaded as it is (the server checks and cleans it); its length is measured here, because files
// recorded in a browser often do not state their own duration.
function audioDuration(blob) {
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(blob);
    let done = false;
    const fin = v => { if (done) return; done = true; URL.revokeObjectURL(url); res(Number.isFinite(v) && v > 0 ? Math.round(v * 1000) : null); };
    a.preload = "metadata";
    a.onloadedmetadata = () => {
      if (a.duration === Infinity) { a.ondurationchange = () => { if (Number.isFinite(a.duration)) fin(a.duration); }; a.currentTime = 1e101; }
      else fin(a.duration);
    };
    a.onerror = () => fin(null);
    setTimeout(() => fin(null), 8000);
    a.src = url;
  });
}

async function prepareMedia(file) {
  if (!looksLikeAudio(file) || looksLikeImage(file)) return prepareImage(file);
  if (file.size > 25 * 1024 * 1024) throw new Error(`${file.name}: audio larger than 25 MB.`);
  return { full: file, thumb: null, name: file.name, audio: true, duration_ms: await audioDuration(file) };
}

async function uploadImage(noteId, p, onProgress) {
  const dur = p.duration_ms ? `&duration_ms=${p.duration_ms}` : "";
  const a = await sendBlob("POST", `/api/notes/${noteId}/attachments?name=${encodeURIComponent(p.name)}${dur}`, p.full, onProgress);
  // Without a preview the card simply shows the full image, so a failed preview is not an error.
  if (p.thumb) await sendBlob("PUT", `/api/media/${a.id}/thumb`, p.thumb).catch(() => {});
  return a;
}

function addPending(files) {
  for (const f of files) {
    const item = { name: f.name, status: "preparing" };
    pendingMedia.push(item);
    prepareMedia(f)
      .then(p => { item.prepared = p; item.audio = !!p.audio; item.url = p.audio ? null : URL.createObjectURL(p.thumb || p.full); item.status = "ready"; })
      .catch(e => { item.status = "error"; item.error = e.message; })
      .finally(renderTray);
  }
  renderTray();
}

function dropPending(item) {
  if (item.url) URL.revokeObjectURL(item.url);
  pendingMedia = pendingMedia.filter(x => x !== item);
  renderTray();
}

function renderTray() {
  const tray = $("tray");
  if (!tray) return;
  tray.replaceChildren(...pendingMedia.map(it => {
    const x = el("button", { className: "x", type: "button", textContent: "×", title: "Remove", onclick: () => dropPending(it) });
    if (it.status === "error") return el("div", { className: "tile error", textContent: it.error }, x);
    const tile = el("div", { className: "tile" + (it.audio ? " audio" : ""), title: it.name });
    if (it.url) tile.append(el("img", { src: it.url, alt: it.name }));
    if (it.audio) tile.append("♪ " + fmtDur(it.prepared?.duration_ms));
    if (it.status !== "ready") tile.append(el("span", { className: "st", textContent: it.status }));
    tile.append(x);
    return tile;
  }));
}

// Uploads images straight onto an existing card (drop on the card).
async function addToCard(n, files, card) {
  const note = el("div", { className: "upnote", textContent: "Preparing…" });
  card.querySelector(".content").prepend(note);
  const errors = [];
  let done = 0;
  for (const f of files) {
    try {
      const p = await prepareMedia(f);
      await uploadImage(n.id, p, frac => { note.textContent = `Adding ${done + 1} of ${files.length}: ${Math.round(frac * 100)}%`; });
      done++;
    } catch (e) { errors.push(e.message); }
  }
  if (errors.length) { note.className = "upnote err"; note.textContent = errors.join(" "); setTimeout(refresh, 4000); }
  else refresh();
}

// Every picture URL carries the attachment's version: a new picture never reuses a cached URL.
const mediaUrl = (a, small) => `/api/media/${a.id}?v=${a.v}` + (small && a.has_thumb ? "&thumb=true" : "");

function lightbox(imgs, start) {
  let i = start;
  const pic = el("img", { alt: "" });
  const cap = el("div", { className: "cap" });
  const box = el("div", { className: "lightbox", role: "dialog", "aria-label": "Image viewer" }, pic, cap);
  const show = k => {
    i = (k + imgs.length) % imgs.length;
    pic.src = mediaUrl(imgs[i], false);
    pic.alt = imgs[i].name || "image";
    cap.textContent = (imgs[i].name || "") + (imgs.length > 1 ? `   ${i + 1} / ${imgs.length}` : "");
  };
  const onKey = e => {
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") show(i + 1);
    else if (e.key === "ArrowLeft") show(i - 1);
  };
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.append(box);
  show(i);
}

/* ---------- audio ----------
   A minimal player over a hidden <audio>: play/pause, a seek bar, elapsed and total time, and speed. Only one
   clip plays at a time. The recorder records with whatever format the browser can make, shows a timer and a level
   meter, and lets the take be played back before it is attached. The microphone is released as soon as recording
   stops, is cancelled, or its card is redrawn. */
let nowPlaying = null;
function audioPlayer(src, durationMs) {
  const audio = el("audio", { preload: "metadata", src });
  const btn = el("button", { className: "play", type: "button", textContent: "▶", "aria-label": "Play" });
  const bar = el("input", { type: "range", min: 0, max: 1000, value: 0, step: 1, className: "seek", "aria-label": "Position" });
  const time = el("span", { className: "time" });
  const speed = el("button", { className: "speed", type: "button", textContent: "1×", title: "Playback speed" });
  let seeking = false;
  const total = () => (Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration * 1000 : durationMs || 0);
  const show = () => {
    time.textContent = `${fmtDur(audio.currentTime * 1000)} / ${fmtDur(total())}`;
    if (!seeking) bar.value = total() ? Math.min(1000, Math.round(audio.currentTime * 1e6 / total())) : 0;
  };
  btn.onclick = () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
  audio.onplay = () => {
    if (nowPlaying && nowPlaying !== audio) nowPlaying.pause();
    nowPlaying = audio;
    btn.textContent = "❚❚"; btn.setAttribute("aria-label", "Pause");
  };
  audio.onpause = audio.onended = () => { btn.textContent = "▶"; btn.setAttribute("aria-label", "Play"); };
  audio.ontimeupdate = audio.onloadedmetadata = audio.ondurationchange = show;
  bar.oninput = () => { seeking = true; time.textContent = `${fmtDur(bar.value / 1000 * total())} / ${fmtDur(total())}`; };
  bar.onchange = () => { audio.currentTime = bar.value / 1000 * total() / 1000; seeking = false; show(); };
  const rates = [1, 1.5, 2];
  speed.onclick = () => { const r = rates[(rates.indexOf(audio.playbackRate) + 1) % rates.length]; audio.playbackRate = r; speed.textContent = r + "×"; };
  show();
  return el("div", { className: "player" }, btn, bar, time, speed, audio);
}

const MAX_RECORDING_MS = 10 * 60 * 1000;
const liveRecorders = new Set();
function recordingType() {
  for (const t of ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", "audio/webm"]) if (window.MediaRecorder?.isTypeSupported?.(t)) return t;
  return "";
}
function recorderEl({ onAttach, onClose, autostart }) {
  const box = el("div", { className: "recorder" });
  let stream, rec, chunks, started, timer, raf, actx, blob, durMs, url;
  const release = () => {
    clearInterval(timer); cancelAnimationFrame(raf);
    stream?.getTracks().forEach(t => t.stop());
    actx?.close?.().catch?.(() => {});
    stream = null; actx = null;
  };
  const cleanup = () => {
    if (rec && rec.state !== "inactive") { rec.onstop = null; try { rec.stop(); } catch {} }
    release();
    if (url) { URL.revokeObjectURL(url); url = null; }
    liveRecorders.delete(box);
  };
  box.cleanup = cleanup;
  const btn = (text, onclick, primary) => el("button", { className: "btn sm" + (primary ? " primary" : ""), type: "button", textContent: text, onclick });
  const close = () => { cleanup(); box.remove(); onClose?.(); };
  const idle = () => box.replaceChildren(btn("● Record", start, true), btn("Close", close));
  const fail = m => { release(); box.replaceChildren(el("span", { className: "err", textContent: m }), btn("Close", close)); };

  async function start() {
    if (!window.isSecureContext) return fail("Recording needs a secure page (localhost or HTTPS).");
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return fail("This browser can't record audio.");
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return fail(e.name === "NotAllowedError" ? "Microphone access was blocked. Allow it in the browser's site settings, then try again." : "No microphone was found."); }
    liveRecorders.add(box);
    const type = recordingType();
    rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
    chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => { durMs = Date.now() - started; release(); blob = new Blob(chunks, { type: rec.mimeType || type || "audio/webm" }); review(); };
    rec.start(1000);
    started = Date.now();
    const clock = el("span", { className: "time", textContent: "0:00" });
    const meter = el("span", { className: "meter", title: "Input level" }, el("i"));
    try {
      actx = new AudioContext();
      const an = actx.createAnalyser();
      an.fftSize = 512;
      actx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const loop = () => {
        an.getByteTimeDomainData(buf);
        let peak = 0;
        for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
        meter.firstChild.style.width = Math.min(100, peak / 128 * 160) + "%";
        raf = requestAnimationFrame(loop);
      };
      loop();
    } catch {}
    timer = setInterval(() => {
      const ms = Date.now() - started;
      clock.textContent = fmtDur(ms);
      if (ms >= MAX_RECORDING_MS && rec.state === "recording") rec.stop();
    }, 250);
    box.replaceChildren(el("span", { className: "recdot", "aria-hidden": "true" }), clock, meter,
      btn("■ Stop", () => { if (rec.state !== "inactive") rec.stop(); }, true),
      btn("Cancel", () => { cleanup(); idle(); say("Recording cancelled."); }));
    say("Recording. Press Stop when you are done.");
  }

  function review() {
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(blob);
    const ext = /ogg/.test(blob.type) ? "ogg" : /mp4/.test(blob.type) ? "m4a" : "webm";
    const when = new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" }).replace(/[/:]/g, "-");
    const name = `Voice note ${when}.${ext}`;
    box.replaceChildren(audioPlayer(url, durMs), el("div", { className: "row" },
      btn("Attach", () => { const p = { full: blob, thumb: null, name, audio: true, duration_ms: durMs }; cleanup(); idle(); onAttach(p); }, true),
      btn("Record again", start),
      btn("Discard", () => { cleanup(); idle(); say("Recording discarded."); })));
    say("Recording stopped. Play it back, then attach or discard it.");
  }

  idle();
  if (autostart) start();
  return box;
}

// Pictures in a card: one image keeps its proportions (space reserved before it loads, never upscaled, height
// capped); two sit side by side; three or more form a grid, with "+N" when there are more than four.
function mediaEl(n, compact) {
  const pics = imageEl(n, compact);
  const clips = n.attachments.filter(a => a.mime.startsWith("audio/")).map(a => el("div", { className: "audio" },
    ...(a.name && !/^Voice note /.test(a.name) ? [el("div", { className: "aname", textContent: a.name, title: a.name })] : []),
    audioPlayer(mediaUrl(a, false), a.duration_ms)));
  if (!pics && !clips.length) return null;
  return el("div", { className: "media-all" }, ...(pics ? [pics] : []), ...clips);
}

function imageEl(n, compact) {
  const imgs = n.attachments.filter(a => a.mime.startsWith("image/"));
  if (!imgs.length) return null;
  const src = mediaUrl;
  const pic = (a, small) => el("img", { src: src(a, small), alt: a.name || "image", loading: "lazy", decoding: "async", width: a.width, height: a.height });
  if (imgs.length === 1) {
    const a = imgs[0], img = pic(a, compact || a.width > 1280);
    img.style.maxWidth = `min(100%, ${a.width}px)`;
    img.onclick = () => lightbox(imgs, 0);
    return el("div", { className: "media one" }, img);
  }
  const grid = el("div", { className: "media grid g" + Math.min(imgs.length, 4) });
  imgs.slice(0, 4).forEach((a, k) => {
    const tile = el("button", { className: "tile", type: "button", title: a.name || "image", onclick: () => lightbox(imgs, k) }, pic(a, true));
    if (k === 3 && imgs.length > 4) tile.append(el("span", { className: "more", textContent: "+" + (imgs.length - 4) }));
    grid.append(tile);
  });
  return grid;
}

function setupMedia() {
  picker = el("input", { type: "file", multiple: true, accept: MEDIA_ACCEPT, hidden: true });
  picker.addEventListener("change", () => { addPending([...picker.files]); picker.value = ""; });
  document.body.append(picker);
  const comp = $("composer");
  comp.addEventListener("dragover", e => { if (hasFiles(e)) { e.preventDefault(); comp.classList.add("drop-on"); } });
  comp.addEventListener("dragleave", e => { if (!comp.contains(e.relatedTarget)) comp.classList.remove("drop-on"); });
  comp.addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation();
    comp.classList.remove("drop-on");
    addPending([...e.dataTransfer.files]);
  });
  comp.addEventListener("paste", e => {
    const files = [...(e.clipboardData?.files || [])].filter(looksLikeMedia);
    if (files.length) { e.preventDefault(); addPending(files); }
  });
  // Show every drop target while files are dragged over the page; never let the browser open a dropped file.
  // Browsers fire dragover continuously while a drag is over the page, but they do not reliably say when a drag
  // leaves the window or is cancelled (Firefox in particular). So the outlines stay on only while dragover keeps
  // arriving, and clear themselves shortly after it stops.
  let dragTimer;
  const endDrag = () => {
    clearTimeout(dragTimer);
    document.body.classList.remove("dragging-files");
    document.querySelectorAll(".drop-on").forEach(x => x.classList.remove("drop-on"));
  };
  window.addEventListener("dragover", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.add("dragging-files");
    clearTimeout(dragTimer);
    dragTimer = setTimeout(endDrag, 300);
  });
  window.addEventListener("drop", e => { if (hasFiles(e)) e.preventDefault(); endDrag(); });
  window.addEventListener("dragend", endDrag);
  window.addEventListener("blur", endDrag);
}

/* ---------- due date field (todo cards) ---------- */
function dueFields(note) {
  const d = el("input", { type: "date", title: "Due date" });
  if (note && note.due_at) d.value = toDateInput(note.due_at);
  const set = days => { const x = new Date(); x.setDate(x.getDate() + days); d.value = `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  const q = (label, fn) => el("button", { className: "btn sm", type: "button", textContent: label, onclick: fn });
  const node = el("div", { className: "row" }, el("span", { className: "label", textContent: "Due" }), d,
    q("Today", () => set(0)), q("Tomorrow", () => set(1)), q("Next week", () => set(7)), q("Clear", () => { d.value = ""; }));
  return { node, value: () => fromDateInput(d.value) };
}

/* ---------- composer ----------
   Card types: note, todo, reminder. Pick one with the buttons, or type #todo / #reminder / #note followed by a
   space and the composer switches to that type (the token is removed and your text is kept). */
const TYPE_TOKEN = /(^|\s)#(todo|reminder|note)(?=\s)/i;
const TYPE_TOKEN_END = /(^|\s)#(todo|reminder|note)\s*$/i;
let composerText = () => "";   // merged text of the active composer, carried across a type switch

function stripToken(text, re) {
  const m = re.exec(text);
  if (!m) return null;
  const rest = (text.slice(0, m.index) + m[1] + text.slice(m.index + m[0].length))
    .replace(/[ \t]{2,}/g, " ").replace(/[ \t]+$/gm, "").replace(/^\s+/, "");
  return { type: m[2].toLowerCase(), text: rest };
}

function switchType(type, text) {
  mode = type;
  mark("modes", "m", type);
  if (type === "todo") {
    // One line becomes the first item; several lines make the first one the title.
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    renderComposer(lines.length > 1 ? { title: lines[0], items: lines.slice(1).join("\n") } : { items: lines[0] || "" });
  } else renderComposer({ text });
  const f = $("composer").querySelector("textarea");
  if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

function openComposerRecorder(autostart) {
  if (!composerRecorder) {
    composerRecorder = recorderEl({
      onAttach: p => { pendingMedia.push({ name: p.name, status: "ready", prepared: p, audio: true }); renderTray(); },
      onClose: () => { composerRecorder = null; },
      autostart,
    });
    $("tray").before(composerRecorder);
  }
  composerRecorder.querySelector("button")?.focus();
}

function renderComposer(carry = {}) {
  const box = $("composer");
  const msg = el("div", { className: "err" });
  const sugg = el("div", { className: "sugg" });
  let ta, title, items, extra, due, fields, kids;
  if (mode === "todo") {
    title = el("input", { placeholder: "Title (optional), e.g. Groceries #home", value: carry.title || "" });
    items = el("textarea", { placeholder: "One item per line", value: carry.items || "" });
    due = dueFields();
    fields = [title, items];
    kids = [title, el("div", { style: "height:8px" }), items, due.node];
    composerText = () => [title.value, items.value].filter(v => v.trim()).join("\n");
  } else {
    ta = el("textarea", { value: carry.text || "", placeholder: mode === "reminder"
      ? "e.g. remind me at 3pm to call Bob, or every Monday at 8am standup. Or pick a time below."
      : "Capture something. Use #tags. #todo or #reminder changes the card type, #photo attaches pictures, #voice records. Drop or paste files here. Ctrl/Cmd+Enter to save." });
    fields = [ta];
    kids = [ta];
    if (mode === "reminder") {
      extra = whenFields();
      kids.push(extra.node, el("div", { className: "hint", textContent: "Reminders alert while Chuck is open in a browser tab." }));
    }
    composerText = () => ta.value;
  }
  attachSuggest(fields, fields[0], sugg);
  fields.forEach(f => f.addEventListener("input", () => {
    if (/(^|\s)#voice(?=\s)/i.test(f.value)) {
      f.value = f.value.replace(/(^|\s)#voice\s/i, "$1");
      openComposerRecorder(true);
    }
    if (/(^|\s)#photo(?=\s)/i.test(f.value)) {
      f.value = f.value.replace(/(^|\s)#photo\s/i, "$1");
      picker.click();
    }
    const r = stripToken(composerText(), TYPE_TOKEN);
    if (r) switchType(r.type, r.text);
  }));

  const save = async () => {
    msg.textContent = "";
    // A type token left at the very end (no space typed after it) switches the type instead of saving.
    const r = stripToken(composerText(), TYPE_TOKEN_END);
    if (r) { switchType(r.type, r.text); return; }
    let body, patch = {};
    if (mode === "todo") {
      const lines = items.value.split("\n").map(l => l.trim()).filter(Boolean);
      if (!lines.length) { msg.textContent = "Add at least one item."; return; }
      body = [title.value.trim(), ...lines.map(l => "- [ ] " + l.replace(/^[-*]\s*(\[[ xX]\]\s*)?/, ""))].filter(Boolean).join("\n");
      const d = due.value();
      if (d) patch.due_at = d;
    } else {
      body = ta.value.trim();
      if (!body && !pendingMedia.some(x => x.status === "ready")) return;
      if (composerRecorder && composerRecorder.querySelector(".recdot")) { msg.textContent = "Stop the recording first."; return; }
    }
    if (pendingMedia.some(x => x.status === "preparing")) { msg.textContent = "Still preparing images…"; return; }
    if (mode === "reminder") {
      let v = extra.value();
      if (!v.remind_at) {
        const p = parseWhen(body);
        if (!p) { msg.textContent = "Couldn't read a time. Pick one below."; return; }
        v = { remind_at: p.at, repeat: p.repeat };
      }
      patch = { ...patch, ...v };
    }
    const ready = pendingMedia.filter(x => x.status === "ready");
    let card;
    try { card = await api("/api/notes" + (ready.length ? "?media=true" : ""), { method: "POST", body: JSON.stringify({ body, ...patch }) }); }
    catch (e) { msg.textContent = e.message; return; }
    const failed = [];
    for (const [k, it] of ready.entries()) {
      try { await uploadImage(card.id, it.prepared, f => { msg.textContent = `Uploading ${k + 1} of ${ready.length}: ${Math.round(f * 100)}%`; }); }
      catch (e) { failed.push(`${it.name}: ${e.message}`); }
    }
    if (ready.length && failed.length === ready.length && !body) await api("/api/notes/" + card.id, { method: "DELETE" }).catch(() => {});
    pendingMedia.forEach(x => x.url && URL.revokeObjectURL(x.url));
    pendingMedia = [];
    renderComposer();
    if (failed.length) $("composer").querySelector(".err").textContent = "Not attached: " + failed.join("; ");
    refresh();
  };
  fields.forEach(f => f.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save(); }));
  const attach = el("button", { className: "btn", type: "button", textContent: "Attach", title: "Attach pictures or audio (or drop or paste them here)", onclick: () => picker.click() });
  const record = el("button", { className: "btn", type: "button", textContent: "Record", title: "Record a voice note (or type #voice)", onclick: () => openComposerRecorder(false) });
  box.replaceChildren(...kids, ...(composerRecorder ? [composerRecorder] : []), el("div", { className: "tray", id: "tray" }), sugg,
    el("div", { className: "row" }, el("button", { className: "btn primary", textContent: "Save", onclick: save }), attach, record, msg));
  renderTray();
}

/* ---------- cards ----------
   Everything on the feed or board is a card with a `kind`. Notes, todos and reminders share one renderer
   (`noteEl`); a new card type can register its own renderer here. Layouts only place cards. */
const CARD_RENDERERS = {};
function cardEl(card, compact) { return (CARD_RENDERERS[card.kind] || noteEl)(card, compact); }

/* ---------- note card ---------- */
/* ---------- Markdown ----------
   Rendered as DOM nodes with textContent only, never innerHTML, so note text cannot inject markup or scripts.
   Raw HTML in a note is shown as plain text. Links must be http, https or mailto. Images are not rendered. */
const INLINE = new RegExp([
  "`([^`\\n]+)`",                                            // 1 inline code
  "\\[([^\\]\\n]+)\\]\\(([^)\\s]+)\\)",                      // 2,3 [text](url)
  "\\*\\*(?!\\s)([^\\n]+?)(?<!\\s)\\*\\*",                   // 4 bold
  "~~(?!\\s)([^\\n]+?)(?<!\\s)~~",                           // 5 strikethrough
  "(?<![\\w*])\\*(?![\\s*])([^*\\n]+?)(?<!\\s)\\*(?![\\w*])", // 6 italic *x*
  "(?<!\\w)_(?!\\s)([^_\\n]+?)(?<!\\s)_(?!\\w)",             // 7 italic _x_
  "(https?:\\/\\/[^\\s<>()]*[^\\s<>().,;:!?'\"])",           // 8 bare URL
  "(?<=^|\\s)#([\\p{L}\\p{N}_-]+)",                          // 9 #tag
].join("|"), "gu");
const SAFE_URL = /^(https?:|mailto:)/i;

function mdLink(href, content) {
  const a = el("a", { href, target: "_blank", rel: "noopener noreferrer nofollow" });
  a.append(content);
  return a;
}

function renderInline(text, inLink = false) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(INLINE)) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[1] !== undefined) frag.append(el("code", { textContent: m[1] }));
    else if (m[2] !== undefined) {
      if (SAFE_URL.test(m[3]) && !inLink) frag.append(mdLink(m[3], renderInline(m[2], true)));
      else frag.append(m[0]);
    } else if (m[4] !== undefined) frag.append(el("strong", {}, renderInline(m[4], inLink)));
    else if (m[5] !== undefined) frag.append(el("s", {}, renderInline(m[5], inLink)));
    else if (m[6] !== undefined) frag.append(el("em", {}, renderInline(m[6], inLink)));
    else if (m[7] !== undefined) frag.append(el("em", {}, renderInline(m[7], inLink)));
    else if (m[8] !== undefined) frag.append(inLink ? m[8] : mdLink(m[8], m[8]));
    else if (m[9] !== undefined) {
      if (inLink) { frag.append(m[0]); continue; }
      const t = m[9].toLowerCase();
      const chip = el("span", { className: "tag", textContent: "#" + m[9], onclick: () => pick(t) });
      paint(chip, t);
      frag.append(chip);
    }
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}

const MD_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
const MD_UL = /^\s*[-*+]\s+/;
const MD_OL = /^\s*\d+[.)]\s+/;
const MD_BLOCK = line => /^```/.test(line) || /^#{1,6}\s/.test(line) || /^>/.test(line) || MD_HR.test(line) || MD_UL.test(line) || MD_OL.test(line);

function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  const lines = text.split("\n");
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^```/.test(line)) {
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++; // closing fence
      frag.append(el("pre", {}, el("code", { textContent: buf.join("\n") })));
    } else if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      frag.append(el("h" + m[1].length, {}, renderInline(m[2])));
      i++;
    } else if (MD_HR.test(line)) {
      frag.append(el("hr"));
      i++;
    } else if (/^>/.test(line)) {
      const buf = [];
      for (; i < lines.length && /^>/.test(lines[i]); i++) buf.push(lines[i].replace(/^>\s?/, ""));
      frag.append(el("blockquote", {}, renderInline(buf.join("\n"))));
    } else if (MD_UL.test(line) || MD_OL.test(line)) {
      const ordered = MD_OL.test(line), re = ordered ? MD_OL : MD_UL;
      const list = el(ordered ? "ol" : "ul");
      for (; i < lines.length && re.test(lines[i]); i++) list.append(el("li", {}, renderInline(lines[i].replace(re, ""))));
      frag.append(list);
    } else {
      const buf = [line];
      for (i++; i < lines.length && lines[i].trim() && !MD_BLOCK(lines[i]); i++) buf.push(lines[i]);
      frag.append(el("div", { className: "md-p" }, renderInline(buf.join("\n"))));
    }
  }
  return frag;
}

function bodyEl(n, card) {
  const box = el("div", { className: "body" });
  const lines = n.body.split("\n");
  let pending = [];
  const flush = () => { if (pending.length) { box.append(el("div", { className: "txtblock" }, renderMarkdown(pending.join("\n")))); pending = []; } };
  lines.forEach((line, i) => {
    const m = ITEM.exec(line);
    if (!m) { pending.push(line); return; }
    flush();
    const done = m[2] !== " ";
    const cb = el("button", { className: "box", type: "button", textContent: done ? "✓" : "", title: done ? "Mark not done" : "Mark done", "aria-pressed": String(done),
      onclick: async () => {
        const l = n.body.split("\n");
        l[i] = l[i].replace(/\[( |x|X)\]/, done ? "[ ]" : "[x]");
        try { const up = await put({ ...n, body: l.join("\n") }, {}); card.replaceWith(noteEl(up, card.classList.contains("compact"))); refresh(); }
        catch (e) { alert(e.message); }
      } });
    box.append(el("div", { className: "item" + (done ? " done" : "") }, cb, el("span", { className: "txt" }, renderInline(m[4]))));
  });
  flush();
  return box;
}

function reminderChip(n, card) {
  const now = Date.now(), due = n.remind_at * 1000 <= now && !n.reminder_done;
  const label = n.reminder_done ? "Reminded " + fmtWhen(n.remind_at) : (due ? "Due " : "") + fmtWhen(n.remind_at);
  const chip = el("div", { className: "rem-chip" + (due ? " due" : "") + (n.reminder_done ? " sent" : "") });
  chip.append("🔔 " + label + (n.repeat ? " · " + n.repeat : ""));
  const act = (text, fn) => chip.append(el("button", { type: "button", textContent: text, onclick: async () => {
    try { card.replaceWith(noteEl(await fn(), card.classList.contains("compact"))); loadFilters(); } catch (e) { alert(e.message); } } }));
  if (!n.reminder_done) {
    act("Done", () => completeReminder(n));
    act("Snooze 10m", () => put(n, { remind_at: Math.floor(Date.now() / 1000) + 600 }));
  } else act("Re-arm", () => put(n, { remind_at: Math.floor(Date.now() / 1000) + 3600 }));
  return chip;
}

// Finish a reminder: repeating ones move to the next occurrence, one-offs are marked done.
function completeReminder(n) {
  return n.repeat ? put(n, { remind_at: nextOccurrence(n.remind_at, n.repeat) }) : put(n, { reminder_done: true });
}

function dueChip(n, open) {
  const now = Date.now(), sameDay = new Date(n.due_at * 1000).toDateString() === new Date().toDateString();
  let cls = "rem-chip", label = "Due " + fmtDue(n.due_at);
  if (!open) cls += " sent";
  else if (n.due_at * 1000 < now) { cls += " due"; label = "Overdue " + fmtDue(n.due_at); }
  else if (sameDay) { cls += " due"; label = "Due today"; }
  return el("div", { className: cls, textContent: "📅 " + label });
}

function noteEl(n, compact) {
  const card = el("div", { className: "note" + (compact ? " compact" : "") });
  if (n.tags.length) paint(card, n.tags[0]); else card.classList.add("plain");
  const stats = isList(n.body) ? listStats(n.body) : null;
  card.dataset.id = n.id;
  // Same rule as the server: a card with any unchecked item is in the pinned group above the rest.
  card.dataset.group = stats && stats.total > stats.done ? "pin" : "rest";
  const created = new Date(n.created_at * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  const acts = el("div", { className: "acts" },
    el("button", { textContent: "Record", title: "Record a voice note on this card", onclick: () => {
      if (card.querySelector(".recorder")) return;
      card.querySelector(".content").prepend(recorderEl({
        onAttach: async p => {
          try { await uploadImage(n.id, p); } catch (e) { alert("Couldn't attach the recording: " + e.message); }
          refresh();
        },
        autostart: true,
      }));
    } }),
    el("button", { textContent: "Edit", onclick: () => edit(card, n, compact) }),
    el("button", { textContent: "Delete", onclick: async () => {
      if (confirm("Delete this note?")) { await api("/api/notes/" + n.id, { method: "DELETE" }); refresh(); }
    } }));
  const lead = el("span", { className: "lead" });
  if (filter !== "@reminders") {   // the reminders view is sorted by time, so cards are not moved there
    const grip = el("button", { className: "grip", type: "button", textContent: "⠿", title: "Drag to move. Or press Space, then the arrow keys.",
      "aria-label": "Move card", "aria-roledescription": "drag handle" });
    grip.addEventListener("pointerdown", e => startCardDrag(e, card));
    grip.addEventListener("keydown", e => keyMoveCard(e, card));
    lead.append(grip);
  }
  lead.append(el("span", { textContent: created }));
  const head = el("div", { className: "head" }, lead);
  if (stats) {
    const pct = stats.total ? Math.round(100 * stats.done / stats.total) : 0;
    const bar = el("span", { className: "bar2" }, el("i", { style: `width:${pct}%` }));
    head.append(el("span", { className: "progress", title: pct + "% done" }, bar, `${stats.done}/${stats.total}`));
  }
  head.append(acts);
  const content = el("div", { className: "content" });
  if (n.remind_at) content.append(reminderChip(n, card));
  if (n.due_at && stats) content.append(dueChip(n, stats.total - stats.done > 0));
  const media = mediaEl(n, compact);
  if (media) content.append(media);
  const body = bodyEl(n, card);
  content.append(body);
  // Every tag is shown on the card (written in the text or added by a rule); click one to filter.
  if (n.tags.length) {
    content.append(el("div", { className: "autotags" },
      ...n.tags.map(t => { const c = el("span", { className: "tag", textContent: "#" + t, title: "Show #" + t, onclick: () => pick(t) }); paint(c, t); return c; })));
  }
  if (compact && (n.body.length > 400 || n.body.split("\n").length > 10)) {
    body.classList.add("clamp");
    const more = el("button", { className: "linkbtn", type: "button", textContent: "Show more", onclick: () => {
      const open = body.classList.toggle("clamp"); more.textContent = open ? "Show more" : "Show less"; } });
    content.append(more);
  }
  if (stats) {
    const add = el("input", { className: "additem", placeholder: "Add item, press Enter" });
    add.addEventListener("keydown", async e => {
      if (e.key !== "Enter" || !add.value.trim()) return;
      try { const up = await put({ ...n, body: n.body.replace(/\s+$/, "") + "\n- [ ] " + add.value.trim() }, {}); card.replaceWith(noteEl(up, compact)); refresh(); }
      catch (err) { alert(err.message); }
    });
    content.append(add);
  }
  card.append(head, content);
  // Each card is a drop target: dropped images are added to it.
  card.addEventListener("dragover", e => { if (hasFiles(e)) { e.preventDefault(); card.classList.add("drop-on"); } });
  card.addEventListener("dragleave", e => { if (!card.contains(e.relatedTarget)) card.classList.remove("drop-on"); });
  card.addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation();
    card.classList.remove("drop-on");
    document.body.classList.remove("dragging-files");
    addToCard(n, [...e.dataTransfer.files], card);
  });
  return card;
}

function edit(card, n, compact) {
  const ta = el("textarea", { value: n.body });
  const wf = whenFields(n);
  const isTodo = n.kind === "todo";
  const df = isTodo ? dueFields(n) : null;
  const msg = el("div", { className: "err" });
  const sugg = el("div", { className: "sugg" });
  attachSuggest([ta], ta, sugg);
  const save = el("button", { className: "btn primary", textContent: "Save", onclick: async () => {
    const v = wf.value();
    const patch = { body: ta.value, remind_at: v.remind_at || -1, repeat: v.repeat };
    if (df) patch.due_at = df.value() || -1;
    try { await api("/api/notes/" + n.id, { method: "PUT", body: JSON.stringify(patch) }); }
    catch (e) { msg.textContent = e.message; return; }
    refresh();
  } });
  const mediaEdit = n.attachments.length ? el("div", { className: "media-edit" }, ...n.attachments.map(a => {
    const isAudio = a.mime.startsWith("audio/");
    const tile = el("span", { className: "tile" + (isAudio ? " audio" : ""), title: a.name || "" },
      isAudio ? "♪ " + fmtDur(a.duration_ms) : el("img", { src: mediaUrl(a, true), alt: a.name || "image" }));
    tile.append(el("button", { className: "x", type: "button", textContent: "×", title: "Remove from card", onclick: async () => {
      if (!confirm(isAudio ? "Remove this recording from the card?" : "Remove this image from the card?")) return;
      try { await api("/api/media/" + a.id, { method: "DELETE" }); tile.remove(); } catch (e) { msg.textContent = e.message; }
    } }));
    return tile;
  })) : null;
  card.replaceChildren(el("div", { className: "content" }, ta, ...(mediaEdit ? [mediaEdit] : []), sugg,
    ...(df ? [df.node] : []),
    el("div", { className: "label", style: "margin-top:10px", textContent: "Reminder (leave blank for none)" }), wf.node,
    el("div", { className: "row" }, save, el("button", { className: "btn", textContent: "Cancel", onclick: () => refresh() }), msg)));
  ta.focus();
}

/* ---------- tag suggestions ----------
   The server returns calibrated confidences. Accepting (click) or dismissing (x) a suggestion is logged and
   nudges that tag's future confidence. */
function sendFeedback(tag, action, confidence) {
  api("/api/suggest/feedback", { method: "POST", body: JSON.stringify({ tag, action, confidence }) }).catch(() => {});
}
// Explains an empty suggestion list, so silence does not look like a broken feature.
function noSuggestionHint(res) {
  const n = res.tagged_notes, notes = n === 1 ? "1 tagged note" : `${n} tagged notes`;
  if (!n) return "No tag suggestions yet. Chuck suggests tags you have used before, so tag a few notes with #tags first.";
  if (res.suggestions.length) return "No other tag suggestions.";
  return `No matching tags from your ${notes}.` + (res.calibrated ? "" : ` Suggestions get more reliable after about ${res.calibrate_at}.`);
}
function attachSuggest(fields, target, box) {
  let timer, seq = 0;
  const dismissed = new Set();
  const run = async () => {
    const text = fields.map(f => f.value).join("\n").trim();
    const mine = ++seq;
    if (text.length < 3) { box.replaceChildren(); return; }
    let res;
    try { res = await api("/api/suggest", { method: "POST", body: JSON.stringify({ text }) }); } catch { return; }
    if (mine !== seq) return;
    const list = res.suggestions.filter(s => !dismissed.has(s.tag));
    if (!list.length) { box.replaceChildren(el("span", { className: "hint", textContent: noSuggestionHint(res) })); return; }
    box.replaceChildren(...(list.length ? [el("span", { className: "label", textContent: "Suggested" })] : []), ...list.map(s => {
      const pctText = Math.round(s.confidence * 100) + "%";
      const chip = el("button", { className: "chip" + (s.tier === "high" ? " high" : ""), type: "button",
        title: `${pctText} likely` + (s.why.length ? ` because of: ${s.why.join(", ")}` : ""),
        onclick: () => {
          const v = target.value.replace(/\s+$/, "");
          target.value = v + (v ? " " : "") + "#" + s.tag + " ";
          sendFeedback(s.tag, "accepted", s.confidence);
          target.focus(); run();
        } }, "#" + s.tag, el("span", { className: "pct", textContent: pctText }));
      paint(chip, s.tag);
      const x = el("button", { className: "chipx", type: "button", textContent: "×", title: "Not relevant",
        onclick: () => { dismissed.add(s.tag); sendFeedback(s.tag, "dismissed", s.confidence); run(); } });
      const wrap = el("span", { className: "chipwrap" }, chip, x);
      paint(wrap, s.tag);
      return wrap;
    }));
  };
  fields.forEach(f => f.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 350); }));
}

/* ---------- auto-tag rules ---------- */
async function loadRules() {
  const box = $("rulelist");
  let rules;
  try { rules = await api("/api/rules"); } catch (e) { box.textContent = e.message; return; }
  box.replaceChildren(...(rules.length ? rules.map(r => {
    const chip = el("span", { className: "tag", textContent: "#" + r.tag }); paint(chip, r.tag);
    return el("div", { className: "rule" }, el("span", { className: "kw", textContent: r.pattern }), "→", chip,
      el("button", { className: "linkbtn", type: "button", textContent: "Remove", onclick: async () => { await api("/api/rules/" + r.id, { method: "DELETE" }); loadRules(); } }));
  }) : [el("div", { className: "hint", textContent: "No rules yet." })]));
}
function setupRules() {
  const msg = $("rule-msg");
  $("rule-add").onclick = async () => {
    msg.textContent = "";
    try {
      await api("/api/rules", { method: "POST", body: JSON.stringify({ pattern: $("rule-kw").value, tag: $("rule-tag").value }) });
      $("rule-kw").value = ""; $("rule-tag").value = ""; loadRules();
    } catch (e) { msg.textContent = e.message; }
  };
  $("rule-apply").onclick = async () => {
    msg.textContent = "";
    try { const r = await api("/api/rules/apply", { method: "POST" }); msg.textContent = r.changed + " note(s) updated."; refresh(); }
    catch (e) { msg.textContent = e.message; }
  };
  loadRules();
}

/* ---------- moving cards ----------
   Drag a card by its grip: it floats under the pointer, a dashed placeholder shows where it will land, and the board
   reflows (Columns re-packs). Dropping puts the card in the placeholder's place at once and saves in the background;
   if saving fails the card goes back. Open todos stay above the other cards, so a card only moves within its group.
   Keyboard: focus the grip, Space to pick up, arrow keys to move, Space to drop, Escape to cancel. */
const sameGroup = (a, b) => b && b.classList.contains("note") && !b.classList.contains("placeholder") && !b.classList.contains("dragging") && b.dataset.group === a.dataset.group;
function groupNeighbours(card) {
  let p = card.previousElementSibling, n = card.nextElementSibling;
  while (p && !sameGroup(card, p)) p = p.previousElementSibling;
  while (n && !sameGroup(card, n)) n = n.nextElementSibling;
  return { prev: p ? Number(p.dataset.id) : null, next: n ? Number(n.dataset.id) : null };
}
const say = text => { $("live").textContent = text; };
function originOf(card) { return { parent: card.parentElement, nextNode: card.nextSibling, ...groupNeighbours(card) }; }
function putBack(card, o) { o.parent.insertBefore(card, o.nextNode && o.nextNode.parentNode === o.parent ? o.nextNode : null); }

async function saveMove(card, o) {
  const { prev, next } = groupNeighbours(card);
  if (prev === o.prev && next === o.next) return;   // dropped where it started
  try { await api(`/api/notes/${card.dataset.id}/move`, { method: "POST", body: JSON.stringify({ prev, next }) }); }
  catch (e) { putBack(card, o); say("Move failed."); alert("Couldn't move the card: " + e.message); }
}

function startCardDrag(e, card) {
  if (e.button > 0 || card.classList.contains("picked")) return;
  e.preventDefault();
  const board = $("out"), rect = card.getBoundingClientRect();
  const o = originOf(card);
  const ph = el("div", { className: "note placeholder" + (card.classList.contains("compact") ? " compact" : "") });
  ph.dataset.group = card.dataset.group;
  ph.style.height = rect.height + "px";
  card.before(ph);
  Object.assign(card.style, { width: rect.width + "px", height: rect.height + "px", left: rect.left + "px", top: rect.top + "px" });
  card.classList.add("dragging");
  document.body.classList.add("moving-card");
  document.body.append(card);   // out of the board, so the board reflows around the placeholder
  const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
  let x = e.clientX, y = e.clientY, raf = 0;

  const place = () => {
    const t = document.elementFromPoint(x, y)?.closest("#out > .note");
    if (!t || t === ph || t.dataset.group !== card.dataset.group) return;
    const r = t.getBoundingClientRect();
    const before = board.classList.contains("rows") ? x < r.left + r.width / 2 : y < r.top + r.height / 2;
    if (before) { if (t.previousElementSibling !== ph) t.before(ph); }
    else if (t.nextElementSibling !== ph) t.after(ph);
  };
  const tick = () => {   // scroll when the pointer is near the top or bottom of the window
    const edge = 70, speed = y < edge ? -(edge - y) / 3 : y > innerHeight - edge ? (y - innerHeight + edge) / 3 : 0;
    if (speed) { scrollBy(0, speed); place(); }
    raf = requestAnimationFrame(tick);
  };
  const move = ev => { x = ev.clientX; y = ev.clientY; card.style.left = x - dx + "px"; card.style.top = y - dy + "px"; place(); };
  const finish = cancel => {
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    removeEventListener("pointercancel", cancelled);
    removeEventListener("keydown", esc, true);
    cancelAnimationFrame(raf);
    card.classList.remove("dragging");
    document.body.classList.remove("moving-card");
    card.style.width = card.style.height = card.style.left = card.style.top = "";
    if (cancel) { ph.remove(); putBack(card, o); return; }
    ph.replaceWith(card);
    saveMove(card, o);
  };
  const up = () => finish(false);
  const cancelled = () => finish(true);
  const esc = ev => { if (ev.key === "Escape") { ev.preventDefault(); finish(true); } };
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
  addEventListener("pointercancel", cancelled);
  addEventListener("keydown", esc, true);
  raf = requestAnimationFrame(tick);
}

function keyMoveCard(e, card) {
  const grip = () => card.querySelector(".grip");
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (!card.classList.contains("picked")) {
      card._origin = originOf(card);
      card.classList.add("picked");
      say("Card picked up. Arrow keys move it, Space drops it, Escape cancels.");
    } else {
      card.classList.remove("picked");
      saveMove(card, card._origin);
      say("Card dropped.");
    }
    return;
  }
  if (!card.classList.contains("picked")) return;
  if (e.key === "Escape") {
    e.preventDefault();
    card.classList.remove("picked");
    putBack(card, card._origin);
    grip()?.focus();
    say("Move cancelled.");
    return;
  }
  const back = e.key === "ArrowUp" || e.key === "ArrowLeft", fwd = e.key === "ArrowDown" || e.key === "ArrowRight";
  if (!back && !fwd) return;
  e.preventDefault();
  let t = back ? card.previousElementSibling : card.nextElementSibling;
  while (t && !sameGroup(card, t)) t = back ? t.previousElementSibling : t.nextElementSibling;
  if (!t) { say(back ? "Already first in its group." : "Already last in its group."); return; }
  back ? t.before(card) : t.after(card);
  grip()?.focus();   // moving the element can drop focus
  card.scrollIntoView({ block: "nearest" });
}

/* ---------- loading: feed and board ---------- */
function params(extra = {}) {
  const p = new URLSearchParams();
  if ($("q").value.trim()) p.set("q", $("q").value.trim());
  if ($("from").value) p.set("from", Math.floor(new Date($("from").value + "T00:00:00").getTime() / 1000));
  if ($("to").value) p.set("to", Math.floor(new Date($("to").value + "T23:59:59").getTime() / 1000));
  Object.entries(extra).forEach(([k, v]) => p.set(k, v));
  return p;
}

/* Column packing: each card's grid span follows its real height. A ResizeObserver keeps it right as images load,
   cards are edited or items ticked; a MutationObserver picks up cards added or replaced anywhere in the board. */
const PACK_ROW = 2, PACK_GAP = 14;
function packCard(card) {
  if (!card.parentElement || !card.parentElement.classList.contains("cols")) { card.style.gridRowEnd = ""; return; }
  const h = card.getBoundingClientRect().height;
  card.style.gridRowEnd = `span ${Math.max(1, Math.ceil((h + PACK_GAP) / PACK_ROW))}`;
}
const packer = new ResizeObserver(entries => entries.forEach(e => packCard(e.target)));
// Cards are re-packed as soon as they change, without waiting for a frame: when added or replaced, when anything
// inside them changes (editing, a new checklist item, "Show more"), and when an image in them finishes loading.
// The ResizeObserver above is the backstop for anything else (for example resizing a text box by hand).
const boardEl = document.getElementById("out");
new MutationObserver(muts => {
  const touched = new Set();
  for (const m of muts) {
    if (m.target === boardEl) {
      m.addedNodes.forEach(n => { if (n.classList?.contains("note")) { touched.add(n); packer.observe(n); } });
      m.removedNodes.forEach(n => { if (n.classList?.contains("note")) packer.unobserve(n); });
    } else {
      const card = m.target.closest?.("#out > .note") || m.target.parentElement?.closest("#out > .note");
      if (card) touched.add(card);
    }
  }
  touched.forEach(packCard);
}).observe(boardEl, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
boardEl.addEventListener("load", e => { if (e.target.tagName === "IMG") { const c = e.target.closest("#out > .note"); if (c) packCard(c); } }, true);

let feedSeq = 0;   // only the newest load may write to the board (fast view switches or typing start several)
async function loadFeed(reset) {
  const board = view === "board";
  const mine = ++feedSeq;
  const extra = { limit: PAGE, offset: reset ? 0 : offset };
  if (filter === "@reminders") extra.reminders = "true"; else if (filter) extra.tag = filter;
  const notes = await api("/api/notes?" + params(extra));
  if (mine !== feedSeq) return;
  if (reset) {
    liveRecorders.forEach(r => { if (r !== composerRecorder) r.cleanup(); });
    offset = 0;
    $("out").replaceChildren();
  }
  $("out").className = board ? "grid " + boardLayout : "";
  notes.forEach(n => $("out").append(cardEl(n, board)));
  offset += notes.length;
  if (reset && !notes.length) $("out").append(el("div", { className: "empty", textContent: filter === "@reminders" ? "No pending reminders" : "Nothing here yet" }));
  $("more").hidden = notes.length < PAGE;
}

async function loadFilters() {
  const [tags, rem] = await Promise.all([api("/api/tags"), api("/api/notes?reminders=true&limit=200")]);
  pendingReminders = rem;
  const box = $("tags");
  const mk = (cls, key, label, count, dot) => {
    const b = el("button", { className: "pill " + cls + (filter === key ? " on" : ""), onclick: () => pick(key) },
      ...(dot ? [el("span", { className: "dot" })] : []), el("span", { className: "t", textContent: label }), el("span", { className: "n", textContent: count }));
    return b;
  };
  box.replaceChildren(mk("", "", "All", ""), mk("rem", "@reminders", "🔔 Reminders", rem.length));
  tags.forEach(t => { const b = mk("", t.tag, "#" + t.tag, t.count, true); paint(b, t.tag); box.append(b); });
}

let pendingReminders = [];
function pick(f) { filter = f; refresh(); }
function syncExport() {
  const p = params();
  p.delete("limit"); p.delete("offset");
  if (filter && filter !== "@reminders") p.set("tag", filter);
  if (filter === "@reminders") p.set("reminders", "true");
  $("export").href = "/api/export" + (p.toString() ? "?" + p : "");
}
async function refresh() {
  syncExport();
  try {
    await loadFeed(true);
    await loadFilters();
  } catch (e) { $("out").replaceChildren(el("div", { className: "err", textContent: e.message })); }
}

/* ---------- reminder alerts (fire while the tab is open) ---------- */
const fired = new Set();
function toast(n) {
  const t = el("div", { className: "toast" }, el("div", { textContent: "🔔 " + n.body.replace(/\s+/g, " ").slice(0, 140) }));
  const close = () => t.remove();
  t.append(el("div", { className: "row" },
    el("button", { textContent: "OK", onclick: close }),
    el("button", { textContent: "Snooze 10m", onclick: async () => { close(); await put(n, { remind_at: Math.floor(Date.now() / 1000) + 600 }); fired.delete(n.id); refresh(); } })));
  $("toasts").append(t);
}
async function checkReminders() {
  try { pendingReminders = await api("/api/notes?reminders=true&limit=200"); } catch { return; }
  const due = pendingReminders.filter(n => n.remind_at * 1000 <= Date.now() && !fired.has(n.id + ":" + n.remind_at));
  for (const n of due) {
    fired.add(n.id + ":" + n.remind_at);
    toast(n);
    if ("Notification" in window && Notification.permission === "granted") new Notification("Chuck reminder", { body: n.body.slice(0, 200) });
    try { await completeReminder(n); } catch {}
  }
  if (due.length) refresh();
}
function setupNotify() {
  const b = $("notify");
  if (!("Notification" in window) || Notification.permission !== "default") return;
  b.hidden = false;
  b.onclick = async () => { await Notification.requestPermission(); b.hidden = true; };
}

/* ---------- chrome: themes, views, modes ---------- */
function mark(groupId, attr, val) { document.querySelectorAll(`#${groupId} button`).forEach(b => b.classList.toggle("on", b.dataset[attr] === val)); }
function setTheme(t) { document.documentElement.dataset.theme = t; localStorage.setItem("chuck-theme", t); mark("themes", "t", t); }
function setView(v) { view = v; localStorage.setItem("chuck-view", v); mark("views", "v", v); $("layouts").hidden = v !== "board"; refresh(); }
function setLayout(l) {
  boardLayout = l;
  localStorage.setItem("chuck-layout", l);
  mark("layouts", "l", l);
  // Switching only changes the board's class; the packer re-measures every card.
  if (view === "board") {
    $("out").className = "grid " + l;
    document.querySelectorAll("#out > .note").forEach(packCard);
  }
}
function setMode(m) { switchType(m, composerText()); }
document.querySelectorAll("#themes button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.v));
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
setTheme(document.documentElement.dataset.theme); mark("views", "v", view); mark("modes", "m", mode);
mark("layouts", "l", boardLayout); $("layouts").hidden = view !== "board";
document.querySelectorAll("#layouts button").forEach(b => b.onclick = () => setLayout(b.dataset.l));

let timer;
["q", "from", "to"].forEach(id => $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(refresh, 200); }));
$("more").onclick = () => loadFeed(false);
setupMedia(); renderComposer(); setupNotify(); setupRules(); refresh();
checkReminders(); setInterval(checkReminders, 30000);
</script>
</body>
</html>
